<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تواصل معي</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
    }
    body {
      background: linear-gradient(135deg, #eef2f7 0%, #e0e8f5 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .contact-card {
      background: #ffffff;
      border-radius: 24px;
      padding: 32px 24px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
      text-align: center;
    }
    .avatar {
      width: 85px;
      height: 85px;
      background: #e0f2fe;
      color: #0284c7;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      margin: 0 auto 16px;
    }
    h2 {
      color: #0f172a;
      font-size: 1.5rem;
      margin-bottom: 6px;
    }
    p {
      color: #64748b;
      font-size: 0.9rem;
      margin-bottom: 24px;
    }
    .links-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .social-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      color: #ffffff;
      transition: transform 0.2s, opacity 0.2s;
    }
    .social-btn:hover {
      transform: translateY(-2px);
      opacity: 0.92;
    }
    .btn-whatsapp { background-color: #25d366; }
    .btn-facebook { background-color: #1877f2; }
    .btn-linkedin { background-color: #0a66c2; }
  </style>
</head>
<body>

  <div class="contact-card">
    <div class="avatar">📫</div>
    <h2>تواصل معي</h2>
    <p>يسعدني تواصلك معي عبر إحدى القنوات التالية:</p>

    <div class="links-list">
      <a href="https://wa.me/qr/YBVCPW2XHT37C1" target="_blank" class="social-btn btn-whatsapp">
        💬 واتساب (WhatsApp)
      </a>
      <a href="https://www.linkedin.com/in/soher-lahloh-869516285/?isSelfProfile=true" target="_blank" class="social-btn btn-linkedin">
        💼 لينكد إن (LinkedIn)
      </a>
    </div>
  </div>

</body>
</html>
